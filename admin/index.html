<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração do Cardápio</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <div class="brand-icon">
                    🍽️
                </div>

                <h1>
                    Administração
                </h1>

                <p>
                    Acesse para gerenciar seu cardápio.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >
                    Entrar
                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
